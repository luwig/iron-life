<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IRON LIFE</title><style>
:root{--bg:#0d1014;--card:#171b21;--line:#303741;--txt:#f4f5f7;--muted:#9aa2ad;--gold:#ffb52e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2a3038,#0d1014 55%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:10px 12px 30px}.top{display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:950;letter-spacing:1px}.time{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.stat b{font-size:16px}.stat span{display:block;color:var(--muted);font-size:10px}.card{background:#171b21;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}.card h2{font-size:15px;margin:0 0 10px}.stage{height:430px;border-radius:13px;position:relative;overflow:hidden;background:linear-gradient(#252b33 0 62%,#12151a 62%);border:1px solid #343b45}.mirror{position:absolute;left:50%;top:28px;transform:translateX(-50%);width:260px;height:335px;border:7px solid #11151a;background:linear-gradient(90deg,#202a33,#46505b 48%,#202a33);box-shadow:inset 0 0 35px #090b0f}.floor{position:absolute;left:0;right:0;bottom:0;height:105px;background:repeating-linear-gradient(90deg,#15181d 0 60px,#1b1f25 60px 64px)}.person{position:absolute;left:50%;bottom:55px;transform:translateX(-50%) scale(1);transform-origin:50% 100%;width:150px;height:325px;transition:.25s}.skin{background:linear-gradient(90deg,#a96f50,#d49a73 48%,#a96f50)}.head{position:absolute;top:0;left:57px;width:36px;height:45px;border-radius:48%;background:#c88d69}.hair{position:absolute;top:-2px;left:55px;width:40px;height:17px;border-radius:50%;background:#25201c}.neck{position:absolute;top:38px;left:61px;width:28px;height:25px}.torso{position:absolute;top:55px;left:28px;width:94px;height:112px;border-radius:45% 45% 25% 25%;background:#c88d69}.chest{position:absolute;top:63px;left:36px;width:78px;height:48px;border-radius:45%;background:#dca58255}.abs{position:absolute;top:105px;left:51px;width:48px;height:56px;background:repeating-linear-gradient(#c88d69 0 7px,#a86f50 8px 10px);opacity:.48;border-radius:8px}.arm{position:absolute;top:61px;width:28px;height:105px;border-radius:18px;background:#c88d69;transform-origin:top}.arm.l{left:10px;transform:rotate(10deg)}.arm.r{right:10px;transform:rotate(-10deg)}.fore{position:absolute;top:150px;width:25px;height:72px;border-radius:15px;background:#c88d69}.fore.l{left:6px}.fore.r{right:6px}.shorts{position:absolute;top:156px;left:35px;width:80px;height:58px;background:#242a33;border-radius:7px 7px 18px 18px}.leg{position:absolute;top:205px;width:34px;height:120px;border-radius:20px;background:#c88d69}.leg.l{left:39px}.leg.r{right:39px}.shoe{position:absolute;bottom:0;width:47px;height:18px;background:#101318;border-radius:10px}.shoe.l{left:24px}.shoe.r{right:24px}.person.m2 .torso{transform:scaleX(1.09)}.person.m3 .torso{transform:scaleX(1.15)}.person.m2 .arm{width:33px}.person.m3 .arm{width:37px}.person.m2 .leg{width:39px}.person.m3 .leg{width:43px}.person.f2 .torso{transform:scaleX(1.12)}.person.f3 .torso{transform:scaleX(1.18)}.person.f2 .abs,.person.f3 .abs{opacity:.12}.lift .arm.l{transform:rotate(-48deg)}.lift .arm.r{transform:rotate(48deg)}.zoom{position:absolute;right:10px;top:10px;display:flex;gap:6px}.zoom button,button{background:#20252d;color:var(--txt);border:1px solid #363e49;border-radius:10px;padding:10px;font-weight:800}.scene{position:absolute;left:10px;bottom:10px;background:#080a0dcc;padding:7px 9px;border-radius:9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.sl{display:grid;grid-template-columns:85px 1fr 45px;align-items:center;gap:7px;margin:8px 0;font-size:12px}.sl input{width:100%}.primary{background:var(--gold);color:#17120a}.msg{background:#10141a;border-left:3px solid var(--gold);padding:9px;border-radius:8px;font-size:12px}.log{height:140px;overflow:auto;background:#0b0e12;border-radius:10px;padding:8px;font:11px/1.5 monospace}.ad{height:62px;display:flex;align-items:center;justify-content:center;border:1px dashed #424954;color:#707984;font-size:11px}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stage{height:390px}.mirror{width:230px;height:305px}.person{transform:translateX(-50%) scale(.9)}.person.z1{transform:translateX(-50%) scale(1.05)}.person.z2{transform:translateX(-50%) scale(1.22)}.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="top"><div class="logo">IRON LIFE</div><div class="time" id="time"></div></div><div class="stats"><div class="stat"><b id="weight"></b><span>체중</span></div><div class="stat"><b id="muscle"></b><span>근육량</span></div><div class="stat"><b id="fat"></b><span>체지방</span></div><div class="stat"><b id="energy"></b><span>에너지</span></div></div><section class="card"><div class="stage"><div class="mirror"></div><div class="floor"></div><div class="person" id="person"><div class="hair"></div><div class="head"></div><div class="neck skin"></div><div class="torso skin"></div><div class="chest"></div><div class="abs"></div><div class="arm l"></div><div class="arm r"></div><div class="fore l"></div><div class="fore r"></div><div class="shorts"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div></div><div class="zoom"><button onclick="zoom(-1)">−</button><button onclick="zoom(1)">＋</button></div><div class="scene" id="scene">거울 앞 · 현재 몸</div></div></section><section class="card"><h2>🧍 처음 모습 만들기</h2><div class="sl"><span>키</span><input id="height" type="range" min="155" max="195" value="178" oninput="customize()"><b id="hv">178</b></div><div class="sl"><span>체형</span><input id="build" type="range" min="0" max="100" value="50" oninput="customize()"><b id="bv">보통</b></div><div class="sl"><span>시작 근육</span><input id="sm" type="range" min="30" max="48" value="42" oninput="customize()"><b id="mv">42</b></div><div class="sl"><span>시작 체지방</span><input id="sf" type="range" min="8" max="30" value="18" oninput="customize()"><b id="fv">18%</b></div><button class="primary" onclick="saveLook()">이 모습으로 시작</button></section><section class="card"><h2>🏋️ 운동</h2><div class="grid"><button onclick="train('벤치프레스',18,.08)">벤치프레스<br><small>에너지 -18 · 근육 +0.08</small></button><button onclick="train('스쿼트',22,.10)">스쿼트<br><small>에너지 -22 · 근육 +0.10</small></button><button onclick="train('데드리프트',25,.12)">데드리프트<br><small>에너지 -25 · 근육 +0.12</small></button><button onclick="train('덤벨 컬',10,.05)">덤벨 컬<br><small>에너지 -10 · 근육 +0.05</small></button></div></section><section class="card"><h2>💬 생활</h2><div class="grid"><button onclick="rest()">🛏️ 휴식<br><small>2시간 · 에너지 +35</small></button><button onclick="eat(true)">🍗 닭가슴살 식사<br><small>회복</small></button><button onclick="eat(false)">🍔 버거<br><small>체지방 증가</small></button><button onclick="sleep()">🌙 잠자기<br><small>8시간 · 완전 회복</small></button></div></section><section class="card"><div class="msg" id="msg">[문자] 코치: 먼저 거울 앞에서 시작 체형을 정하세요.</div></section><section class="card"><h2>📱 생활 기록</h2><div class="log" id="log"></div></section><section class="card ad">광고 자리 — 실제 배포 때 광고 플랫폼 연결</section></div><script>
const S={day:1,hour:6,weight:78,muscle:42,fat:18,energy:100,zoom:0};const $=x=>document.getElementById(x);function render(){$('weight').textContent=S.weight.toFixed(1)+' kg';$('muscle').textContent=S.muscle.toFixed(2)+' kg';$('fat').textContent=S.fat.toFixed(1)+'%';$('energy').textContent=Math.round(S.energy);$('time').textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,'0')}:00`;body()}function body(){let p=$('person');p.className='person';if(S.muscle>=46)p.classList.add('m3');else if(S.muscle>=43)p.classList.add('m2');if(S.fat>=24)p.classList.add('f3');else if(S.fat>=20)p.classList.add('f2');if(S.zoom)p.classList.add('z'+S.zoom)}function log(t){let d=document.createElement('div');d.textContent=`[${String(S.hour).padStart(2,'0')}:00] ${t}`;$('log').prepend(d)}function advance(h){S.hour+=h;while(S.hour>=24){S.hour-=24;S.day++;S.energy=Math.min(100,S.energy+25);log('하루 종료 · 회복 적용')}}function train(n,c,g){if(S.energy<c){$('msg').textContent='[문자] 코치: 너무 지쳤습니다. 먼저 회복하세요.';return}S.energy-=c;S.muscle+=g;S.weight+=g*.35;S.fat=Math.max(7,S.fat-.04);advance(1);$('person').classList.add('lift');$('scene').textContent=n+' · 운동 중';setTimeout(()=>{$('person').classList.remove('lift');$('scene').textContent='거울 앞 · 몸이 변하고 있습니다.'},650);log(n+' 완료 · 근육 +'+g.toFixed(2)+'kg');$('msg').textContent='[문자] 코치: 좋은 세트였습니다. 다음 세트를 할까요?';render()}function rest(){S.energy=Math.min(100,S.energy+35);advance(2);log('휴식 · 에너지 +35');render()}function eat(clean){S.energy=Math.min(100,S.energy+22);if(clean){S.muscle+=.02;S.weight+=.12;log('식단 식사 · 회복')}else{S.fat+=.35;S.weight+=.25;log('버거 · 체지방 증가')}advance(1);render()}function sleep(){S.energy=100;advance(8);log('수면 · 완전 회복');render()}function zoom(d){S.zoom=Math.max(0,Math.min(2,S.zoom+d));body()}function customize(){let h=+$('height').value,b=+$('build').value,m=+$('sm').value,f=+$('sf').value;$('hv').textContent=h;$('bv').textContent=b<35?'슬림':b>65?'탄탄':'보통';$('mv').textContent=m;$('fv').textContent=f+'%';S.muscle=m;S.fat=f;S.weight=60+(h-155)*.42+(b-50)*.12;render()}function saveLook(){localStorage.setItem('ironLifeStart',JSON.stringify(S));$('msg').textContent='[문자] 시스템: 이 모습으로 시작합니다. 이제 몸을 만들어보세요.';log('초기 체형 저장')}render();log('헬스장에 입장했습니다.');
</script></body></html>
